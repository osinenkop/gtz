job:
  generate_name: gtz63-lowactive
  flavor: 20cpu-320ram
  preemption: allowed
  time_limit: 20h
  image: docker-proxy.artifactory.tcsbank.ru/python:3.12-slim
  work_dir: /work
  input:
    - type: files
      src: ./
      dst: /work
      mask: "**/*.py"
    - type: files
      src: ./verify/out/v22_low_active.json
      dst: /work/verify/out/v22_low_active.json
  entrypoint: /bin/sh
  args:
    - -c
    - |
      pip install -q numpy scipy sympy && cd /work && python -u v24_low_active_feasibility.py --sizes 9 --starts 60
